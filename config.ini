[server]
host = 192.168.1.29
port = 5005

[serial]
timeout = 1
max_buffer_size = 10240

[gpio]
forward_pin = 27
backward_pin = 22
front_brake_pin = 5
rear_brake_pin = 6
autonomous_pin = 23
emergency_pin = 24
lifesign_pin = 25
reset_pin1 = 13
reset_pin2 = 26

[timings]
#life_sign kontrol döngüsü 
lifesign_interval = 1
# son ping alındıktan sonra life-sign'ın HIGH kalma süresi
# sunucunun PING sıklığından biraz daha uzun olmalı (örneğin, sunucu her 5 saniyede bir PING gönderiyorsa, bu değeri 7-10 saniye)
ping_timeout = 3
# TCP yeniden bağlanma denemeleri arasındaki süre (saniye)
tcp_reconnect_interval = 3
# TCP recv tampon boyutu (bayt)
tcp_recv_buffer_size = 1024
# Harici kart reset sinyalinin HIGH kalma süresi (saniye)
reset_pulse_duration = 1.0

[vfd]
# GPIO18 donanımsal PWM adayı; VFD kontrolü 0-50 Hz arasında 5 Hz adımlıdır.
pwm_pin = 18
pwm_frequency = 1000
resolution_bits = 10
min_hz = 0
max_hz = 50
step_hz = 5

[serial_baudrate]
1 = 9600
2 = 9600
3 = 9600
4 = 9600

[imu]
# The BNO055 connected directly to the Raspberry Pi 5 over I2C is independent of devices 1-4.
enabled = true
device_id = 5
i2c_address = 0x28
calibration_samples = 100
calibration_interval = 0.01
# 0.02 seconds = 50 Hz. Set to 1.0 to match the Arduino example's actual delay(1000).
sample_interval = 0.02
acceleration_deadband = 0.05
reconnect_interval = 2.0

[logging]
level = INFO
format = %%(asctime)s - %%(name)s - %%(levelname)s - %%(message)s
