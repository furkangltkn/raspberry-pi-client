[server]
host = 10.77.231.104
port = 5005

[serial]
timeout = 1
max_buffer_size = 10240
# ACIL_DURUM:0/1 bilgisini gönderen Arduino Mega cihaz kimliği.
hardware_emergency_device_id = 3

[gpio]
forward_pin = 27
backward_pin = 22
front_brake_pin = 5
rear_brake_pin = 6
autonomous_pin = 23
emergency_pin = 24
lifesign_pin = 25
reset_pin1 = 13
reset_pin2 = 26
# Mega sabit HIGH çıkışı: BCM GPIO16, fiziksel pin 36.
mega_pin = 4

[timings]
#life_sign kontrol döngüsü 
lifesign_interval = 0.1
# son ping alındıktan sonra life-sign'ın HIGH kalma süresi
# Backend 0.25 saniyede bir PING gönderir; 1.3 saniye yaklaşık beş PING periyodu toleransı sağlar.
ping_timeout = 2.0
# TCP yeniden bağlanma denemeleri arasındaki süre (saniye)
tcp_reconnect_interval = 3
# TCP recv tampon boyutu (bayt)
tcp_recv_buffer_size = 1024
# Harici kart reset sinyalinin HIGH kalma süresi (saniye)
reset_pulse_duration = 1.0
# Bağlantı kaybında frenlerin bağlı kalacağı süre (saniye).
# Bağlantı geri gelmese bile bu süre dolunca bağlantı kaybı freni bırakılır.
heartbeat_brake_min_duration = 30.0

[vfd]
# İki VFD aynı hedef Hz/duty ile ayrı PWM pinlerinden kontrol edilir.
# BCM GPIO18 = fiziksel pin 12, BCM GPIO12 = fiziksel pin 32.
pwm_pin = 18
pwm_pin2 = 12
pwm_frequency = 1000
resolution_bits = 10
min_hz = 0
max_hz = 50
step_hz = 5
# Arayüz hedefi 5 Hz değiştirir; RPi PWM'i 1 Hz'lik adımlarla hedefe taşır.
manual_ramp_step_hz = 1
manual_ramp_interval = 0.16

[autonomous_vfd]
# STM32 F:1 durumunda test için uygulanacak ileri frekansı.
forward_hz = 10
# STM32 B:1 durumunda abs(SX) test için bu değerde tutulur.
reverse_target_sx = 1.0
reverse_start_hz = 10.0
reverse_step_hz = 1.0
speed_tolerance = 0.2
# Geri hız kontrolü ve STM32 paket zaman aşımı (saniye).
control_interval = 0.1
packet_timeout = 0.5

[serial_baudrate]
1 = 115200
2 = 115200
3 = 115200
4 = 115200

[imu]
# The BNO055 connected directly to the Raspberry Pi 5 over I2C is independent of devices 1-4.
enabled = true
device_id = 5
i2c_address = 0x28
# Yalnızca kartta çalışan 32.768 kHz kristal bulunduğu kesin ise true yapın.
external_crystal = false
calibration_samples = 100
calibration_interval = 0.01
# Eksik Euler/ivme verisi gelirse kalibrasyonda sonsuza kadar bekleme.
calibration_timeout = 15.0
# Arayüz ve diğer telemetriyi yoğunlaştırmamak için 0.20 saniye = 5 Hz.
sample_interval = 0.20
acceleration_deadband = 0.05
reconnect_interval = 2.0

[logging]
level = INFO
format = %%(asctime)s - %%(name)s - %%(levelname)s - %%(message)s
